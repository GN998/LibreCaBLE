name: Android CI Build

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  # Restrict default GITHUB_TOKEN scope to read-only for branch and PR builds
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded branch or PR runs when new commits are pushed
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      # Force Node 24 runtime to resolve action runner deprecation warnings
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Short Commit SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Provision Gradle 9.4.1 required by AGP 9.2.1 and API 37
          gradle-version: '9.4.1'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Materialize deterministic release keystore required by CredentialManager allowlist checks
          echo "$KEYSTORE_BASE64" | base64 -d > my-release-key.jks

      - name: Build Release APK
        env:
          CUSTOM_TUNNEL_ID: ${{ secrets.CUSTOM_TUNNEL_ID }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace --parallel --no-daemon
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/librecable-${SHORT_SHA}.apk"

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: librecable-release-apk-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/release/librecable-${{ env.SHORT_SHA }}.apk
          if-no-files-found: error
          retention-days: 7