name: Android Release Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  # Grant write access solely to tag-triggered workflows for creating and publishing releases
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Prevent mid-flight cancellation from leaving orphaned draft releases
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      # Force Node 24 runtime to resolve action runner deprecation warnings
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Tag Version
        run: |
          # Abort before draft creation if tag mismatches versionName to avoid burning an immutable tag
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION=$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')

          if [ "$EXPECTED_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::Tag (${GITHUB_REF_NAME}) does not match versionName ($GRADLE_VERSION) in app/build.gradle.kts!"
            exit 1
          fi

          echo "APK_FILENAME=librecable-${GITHUB_REF_NAME}.apk" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Provision Gradle 9.4.1 required by AGP 9.2.1 and API 37
          gradle-version: '9.4.1'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Materialize deterministic release keystore required by CredentialManager allowlist checks
          echo "$KEYSTORE_BASE64" | base64 -d > my-release-key.jks

      - name: Build & Verify Release APK
        env:
          CUSTOM_TUNNEL_ID: ${{ secrets.CUSTOM_TUNNEL_ID }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace --parallel --no-daemon

          # Verify deterministic signing certificate before attaching assets to an immutable release
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER" verify app/build/outputs/apk/release/app-release.apk

          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/${APK_FILENAME}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd app/build/outputs/apk/release

          # Reuse existing draft on workflow retry, or create a new draft release
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${APK_FILENAME}" --clobber
          else
            gh release create "$TAG" \
              "${APK_FILENAME}" \
              --draft \
              --verify-tag \
              --title "LibreCaBLE $TAG" \
              --generate-notes
          fi

          # Publish atomically to lock assets & tag and generate release attestation
          gh release edit "$TAG" --draft=false

          # Verify immutability status
          IS_IMMUTABLE=$(gh release view "$TAG" --json isImmutable --jq '.isImmutable')
          echo "Published $TAG (isImmutable=$IS_IMMUTABLE)"